		<td width="800">
		天安门始建于明永乐十五年（1417年），原名“承天门”，取“承天启运”,“受命于天”之意。当时天安门是一座黄瓦飞檐、三层楼的五洞牌坊，<img border="0" src="images/都市盛景/天安门/天安门.jpg" width="200" height="133" align="right" hspace="10" vspace="10">朱漆金钉，光彩夺目。洞后延伸一条笔直的中心御道，穿过端门，直通皇宫正门的午门。御道两侧，按左宗庙、右社稷的传统建制排建。御道两侧增筑红墙，一直延伸到天安门外，与两道干步廊相连，成为一个封闭状态的宫廷广场。</td>
