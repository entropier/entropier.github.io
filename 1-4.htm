		<td width="800">
		位于武夷山群峰的南端,可见到宛若城廓的巨岩,那就是一线天景区终被叫做&quot;灵岩&quot;的地方.灵岩巅顶斜覆而出,整整覆盖着三个毗邻的山洞,右边是伏羲洞,中间为风洞,左为灵岩洞,<img border="0" src="images/雄峰俊岭/一线天/一线天.jpg" width="150" height="200" align="right" hspace="10" vspace="10">游人只要探身伏羲洞便可见到洞内光亮如昼,仰观崖顶,能发现这道光亮来自崖顶的十仗之遥的大裂缝,这便是&quot;一线天&quot;
