		北戴河在河北省秦皇岛市区西南15公里处。它西起戴河口，东至鹰角石，东西长约10公里，南北宽仅2公里，是一处狭长的天然海滨浴场。 北戴河风光秀丽，<img border="0" src="images/滔滔大河/北戴河/北戴河.jpg" width="360" height="255" align="right" hspace="10" vspace="10">苍翠的青山和浩瀚的大海相映，精致的别墅与葱郁的林海交融，海岸线漫长曲折，是我国质量最好的海水浴场之一。每年5月至10月来此避暑、疗养和游览的游客络绎不绝。</td>
